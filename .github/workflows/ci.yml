name: FluentUp CI & Release Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend FastAPI Pytest & Schema Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Integration & Security Tests
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
        run: pytest tests -v

      - name: Apply Supabase Migrations to Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/postgres_auth_stub.sql
          for migration in ../../supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run Backend Tests Against the Real Postgres Schema
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest tests -v

  mobile-checks:
    name: Mobile Expo TypeScript, Tests & Config Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies with lockfile
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Mobile Jest Test Suite
        run: npm test -- --ci

      - name: Validate Production Expo Config (Target SDK 36 & Package ID)
        env:
          APP_ENV: production
          EXPO_PUBLIC_APP_ENV: production
          APP_PACKAGE_ID: com.fluentup.app
        run: npx expo config --type public
